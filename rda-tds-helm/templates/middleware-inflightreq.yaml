{{- if hasPrefix "traefik" .Values.webapp.ingress.controller }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.webapp.name }}-inflightreq
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.webapp.group }}
spec:
  inFlightReq:
    amount: {{ .Values.webapp.tds.limit_connections }}
    sourceCriterion:
      ipStrategy:
        depth: 0  # 0 = key on connection source address (real client IP; incoming X-Forwarded-For is empty at middleware time)

{{- end }}
