{{- if hasPrefix "traefik" .Values.webapp.ingress.controller }}
# Legacy URL compatibility: /thredds/<service>/(files|aggregations)/g/<dsid>/... -> /thredds/<service>/(files|aggregations)/<dsid>/...
# Internal rewrite (no client redirect). Attached to the main ingress router; requests that
# don't match the regex pass through unchanged. Replaces the nginx rewrite-target ingress-g-redirect.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.webapp.name }}-g-rewrite
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.webapp.group }}
spec:
  replacePathRegex:
    regex: ^/thredds/(.+)/(files|aggregations)/g/(d[0-9]{6}.*)
    replacement: /thredds/${1}/${2}/${3}

{{- end }}
