apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.webapp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.webapp.name }}
    group: {{ .Values.webapp.group }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryCount }}
  selector:
    matchLabels:
      app: {{ .Values.webapp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.webapp.name }}
      annotations:
        restartedAt: {{ .Values.restartedAt | default "never" | quote }}
    spec:
      #securityContext:
      #  runAsUser: 1234 # Specify the desired user ID
      #  runAsGroup: 1234 # Specify the desired group ID
      #  fsGroup: 1234 # Specify the desired group ID for volume ownership
      volumes:
        - name: {{ .Values.webapp.campaignMount.name }}
          nfs:
            server: {{ .Values.webapp.campaignMount.server }}
            path: {{ .Values.webapp.campaignMount.path }}
            readOnly: {{ .Values.webapp.campaignMount.readOnly }}
        # Add the log PVC to the deployment
        - name: {{ .Values.webapp.logPersist.fs.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.webapp.logPersist.fs.name }}
        # Add the TDS index files PVC to the deployment
        - name: {{ .Values.webapp.tdsPersist.fs.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.webapp.tdsPersist.fs.name }}
      containers:
      # tds container
      - name: {{ .Values.webapp.name }}
        image: {{ .Values.webapp.tds.image }}
        resources:
          limits:
            memory: {{ .Values.webapp.tds.memory }}
            cpu: {{ .Values.webapp.tds.cpu }}
            ephemeral-storage: {{ .Values.webapp.tds.ephemeralStorageLimit }}
        ports:
        - containerPort: {{ .Values.webapp.tds.port }}

        # apply tds health probe internally within the cluster
        startupProbe: # Allows slow JVM/catalog startup (48G heap) without liveness killing it prematurely
          httpGet:
            path: /thredds/catalog/catalog.html
            port: {{ .Values.webapp.tds.port }}
          timeoutSeconds: 10 # was defaulting to 1s, too tight for a cold JVM
          failureThreshold: 60
          periodSeconds: 10 # up to 10 min to come up before readiness probing begins
        readinessProbe: # Pulls pod out of Service/ingress rotation fast when it can't serve, e.g. OOM/zombie state
          httpGet:
            path: /thredds/folder.png # cheap way to check if the service is up
            port: {{ .Values.webapp.tds.port }}
          periodSeconds: 10
          timeoutSeconds: 15
          failureThreshold: 6 # ~60s of failures before pod is marked NotReady; tolerates brief saturation without pods dropping out in a cascade
          successThreshold: 1

        env:
          - name: THREDDS_XMX_SIZE
            value: {{ .Values.webapp.tds.env.THREDDS_XMX_SIZE }}
          - name: THREDDS_XMS_SIZE
            value: {{ .Values.webapp.tds.env.THREDDS_XMS_SIZE }}
          - name: K8S_POD_NAME # Inject the current pod's name into the container environment so that server.xml can use it for access log naming
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: JAVA_OPTS # Heap dump to PVC (not ephemeral) with a fixed per-pod filename; exit fast on OOM so container restarts. CPU count pinned to the CPU limit so GC/thread pools are sized for it
            value: "-XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/usr/local/tomcat/temp/$(K8S_POD_NAME).hprof  -XX:ActiveProcessorCount={{ .Values.webapp.tds.cpu }}"
        lifecycle:
          postStart: # JVM refuses to overwrite an existing dump file, so remove this pod's previous dump on (re)start
            exec:
              command: ["/bin/sh", "-c", "rm -f /usr/local/tomcat/temp/${K8S_POD_NAME}.hprof"]
        volumeMounts:
        - mountPath: /data/rda/ # Was /gpfs/csfs1/. Required due to TDS
          name: {{ .Values.webapp.campaignMount.name }}
        - mountPath: /usr/local/tomcat/logs
          name: {{ .Values.webapp.logPersist.fs.name }}
        - mountPath: {{ .Values.webapp.tdsPersist.fs.mountPath }} #/data/TDSIndexFiles/data/rda/data
          name: {{ .Values.webapp.tdsPersist.fs.name }}
        - mountPath: /usr/local/tomcat/content/thredds/cache/cdm # TDS cache cdm dir
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tds-temp-cache-cdm
        - mountPath: /usr/local/tomcat/content/thredds/cache/ncss # TDS cache ncss dir
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tds-temp-cache-ncss
        - mountPath: /usr/local/tomcat/content/thredds/cache/wcs # TDS WCS cache dir
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tds-temp-cache-wcs
        - mountPath: /usr/local/tomcat/content/thredds/cache/edal-java # TDS WMS tile cache dir
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tds-temp-cache-edal-java
        - mountPath: /usr/local/tomcat/content/thredds/logs # TDS logs dir
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tds-temp-logs
        - mountPath: /usr/local/tomcat/temp # TDS temp files (heapdump location)
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tds-overflow/tomcat-temp
        - mountPath: /usr/local/tomcat/work # TDS work files
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tds-overflow/tomcat-work
        # - mountPath: /usr/local/tomcat/content/thredds
        #   name: {{ .Values.webapp.tdsPersist.fs.name }}
        #   subPath: thredds-content # Full thredds dir on PVC - refreshed on every restart by initContainer
        # - mountPath: /usr/local/tomcat/work
        #   name: {{ .Values.webapp.tdsPersist.fs.name }}
        #   subPath: tds-overflow/work # Tomcat JSP compile cache
        - mountPath: /tmp
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tds-overflow/tmp # JVM temp files

      # Logs container
      - name: {{ .Values.webapp.logs.name }}
        image: {{ .Values.webapp.logs.image }}
        resources:
          limits:
            memory: {{ .Values.webapp.logs.memory }}
            cpu: {{ .Values.webapp.logs.cpu }}
            ephemeral-storage: {{ .Values.webapp.logs.ephemeralStorageLimit }}
        ports:
        - containerPort: {{ .Values.webapp.logs.port }}
        volumeMounts:
        - mountPath: /usr/local/tomcat/logs
          name: {{ .Values.webapp.logPersist.fs.name }}
      # TDM container
      - name: {{ .Values.webapp.tdm.name }}
        image: {{ .Values.webapp.tdm.image }}
        resources:
          limits:
            memory: {{ .Values.webapp.tdm.memory }}
            cpu: {{ .Values.webapp.tdm.cpu }}
            ephemeral-storage: {{ .Values.webapp.tdm.ephemeralStorageLimit }}
        ports:
        - containerPort: {{ .Values.webapp.tdm.port }}
        env:
          - name: TDM_XMX_SIZE
            value: {{ .Values.webapp.tdm.env.TDM_XMX_SIZE }}
          - name: TDM_XMS_SIZE
            value: {{ .Values.webapp.tdm.env.TDM_XMS_SIZE }}
        volumeMounts:
        - mountPath: {{ .Values.webapp.tdsPersist.fs.mountPath }} #/data/TDSIndexFiles/data/rda/data
          name: {{ .Values.webapp.tdsPersist.fs.name }}
        - mountPath: /usr/local/tomcat/content/tdm/logs
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tdm-logs # Use a subPath to speperate from root level TDSIndexFiles in PVC
        - mountPath: /usr/local/tomcat/.unidata/cache
          name: {{ .Values.webapp.tdsPersist.fs.name }}
          subPath: tdm-unidata-cache # netCDF-Java's default gzip/bzip2 decompression scratch dir; TDM runs non-root and can't create this under root-owned /usr/local/tomcat otherwise
        - mountPath: /data/rda/ # Glade
          name: {{ .Values.webapp.campaignMount.name }}
