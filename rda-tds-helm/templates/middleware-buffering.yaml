{{- if eq .Values.webapp.ingress.controller "traefik" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.webapp.name }}-buffering
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.webapp.group }}
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.webapp.tds.maxUploadBytes }}

{{- end }}
