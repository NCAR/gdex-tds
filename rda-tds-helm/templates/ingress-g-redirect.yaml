# Legacy URL compatibility: /thredds/<service>/(files|aggregations)/g/<dsid>/... -> /thredds/<service>/(files|aggregations)/<dsid>/...
# Implemented as an internal rewrite (rewrite-target) because configuration-snippet is disabled on the controller.
# Separate Ingress object, so it carries its own copy of the main ingress rate limits.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.webapp.name }}-g-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.webapp.group }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /thredds/$1/$2/$3 
    nginx.ingress.kubernetes.io/proxy-read-timeout: "{{ .Values.webapp.tds.responseTimeout }}"
    nginx.ingress.kubernetes.io/limit-rps: "{{ .Values.webapp.tds.limit_rps }}"
    nginx.ingress.kubernetes.io/limit-connections: "{{ .Values.webapp.tds.limit_connections }}"
    nginx.ingress.kubernetes.io/load-balance: "{{ .Values.webapp.tds.load_balance }}"
spec:
  ingressClassName: nginx-external
  rules:
  {{- range $fqdn := list .Values.webapp.tls.fqdn .Values.webapp.tls.fqdn2 .Values.webapp.tls.fqdn3 }}
  - host: {{ $fqdn }}
    http:
      paths:
      - path: /thredds/(.+)/(files|aggregations)/g/(d[0-9]{6}.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ $.Values.webapp.name }}
            port:
              number: {{ $.Values.webapp.tds.port }}
  {{- end }}
