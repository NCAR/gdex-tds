replicaCount: 3
revisionHistoryCount: 9
restartedAt: "2026-11-23T07:24:02Z"

backup:
  enabled: true
  prefix: tds-data
  logs:
    enabled: true
    prefix: tds-tomcat-logs
  
webapp:
  name: rda-tds
  group: rda-tds
  path: /
  # SSL/TLS encryption for the user browser to Ingress connection
  tls:
    # Fully Qualified Domain Name (e.g.: <app-name>.k8s.ucar.edu)
    fqdn: tds.k8s.ucar.edu       
    fqdn2: tds.gdex.ucar.edu
    fqdn3: thredds.rda.ucar.edu
    # Kubernetes Secret that contains the TLS certificate
    secretName: incommon-cert-tds
  ingress:
    # Which controller implements rate limiting etc.: "traefik" (Middleware CRDs) or "nginx-external" (nginx.ingress annotations)
    controller: nginx-external
    # Ingress class to use (e.g., nginx-external, traefik-external); keep consistent with controller
    className: nginx-external
  tds:
    image: docker.io/potatofever/rda-tds:v5.7-sha-db8eea9
    port: 8080
    memory: 96G
    cpu: 8
    ephemeralStorageLimit: 5Gi
    responseTimeout: 180
    maxUploadSize: 30m  # nginx proxy-body-size
    maxUploadBytes: 31457280  # 30m in bytes for Traefik buffering middleware
    # nginx-external only (ignored for traefik). Treated as one global bucket, so limits are much higher than the per-IP Traefik ones below
    nginx:
      load_balance: ewma  # weighted load balancing to avoid traffic concentrating on a subset of pods
      limit_connections: 15  # nginx limit-connections
      limit_rps: 30          # nginx limit-rps
      limit_burst_multiplier: 5  # nginx limit-burst-multiplier (nginx default)
    limit_connections: 15   # Traefik inFlightReq: max concurrent requests per client IP (assumes keying is truly per IP)
    limit_rps: 30          # Traefik rateLimit: average requests/second per client IP
    limit_rps_burst: 60    # Traefik rateLimit burst per client IP (2x limit_rps)
    env:
      THREDDS_XMX_SIZE: 64G
      THREDDS_XMS_SIZE: 64G  # Same as Xmx to avoid heap-resize GC pauses
  logs: 
    name: rda-logs
    image: docker.io/potatofever/rda-logs:sha-3f40dca
    port: 8080
    memory: 2G
    cpu: 1
    ephemeralStorageLimit: 1Gi
  tdm:
    name: gdex-tdm
    image: docker.io/potatofever/gdex-tdm:v5.7-sha-6ff3b1a
    port: 8080
    memory: 6G
    cpu: 2
    ephemeralStorageLimit: 2Gi
    env:
      TDM_XMX_SIZE: "5G"
      TDM_XMS_SIZE: "2G"
      TDS_HOST: "http://localhost:8080/" # TDS container in the same pod
      TDS_CONTENT_ROOT_PATH: "/usr/local/tomcat/content/tdm" # TDM catalogs live in <this>/thredds (see Dockerfile-tdm)
  campaignMount:
    name: campaign
    server: gladedm1.ucar.edu
    path: /glade/campaign/collections/gdex/
    readOnly: true
  blockDataset:
    enabled: false
    dsid: d313006
  tdsPersist:
    fs:
      name: tds-persist
      size: 1.5Ti
      mountPath: /data/TDSIndexFiles/data/rda/data # /tmp2/TDSIndexFiles # /data/TDSIndexFiles
  logPersist:
    fs:
      name: logs-persist
      size: 200Gi
      mountPath: /usr/local/tomcat/logs

